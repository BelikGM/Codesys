<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 372" width="720" height="372" role="img" aria-label="Схема вкладки Установки соединения: кнопка Сканировать сеть, список найденных контроллеров, зелёная отметка активного устройства">
  <style>
    .win  { fill:#F0F1EE; stroke:#A8AFA6; stroke-width:1 }
    .pane { fill:#FFFFFF; stroke:#B9BEB8; stroke-width:1 }
    .bar  { fill:#E4E6E1; stroke:#B9BEB8; stroke-width:1 }
    .btn  { fill:#E9EBE6; stroke:#8E958C; stroke-width:1 }
    .btnA { fill:#14584A; stroke:#0D3F34; stroke-width:1 }
    .t    { font-family:"Segoe UI",Arial,sans-serif; font-size:11px; fill:#1A1D1A }
    .tb   { font-family:"Segoe UI",Arial,sans-serif; font-size:11px; font-weight:600; fill:#1A1D1A }
    .tm   { font-family:"Segoe UI",Arial,sans-serif; font-size:11px; fill:#6A716B }
    .tt   { font-family:"Segoe UI",Arial,sans-serif; font-size:11px; fill:#FFFFFF }
    .mono { font-family:"Consolas","DejaVu Sans Mono",monospace; font-size:10.5px; fill:#1A1D1A }
    .cn   { font-family:"Segoe UI",Arial,sans-serif; font-size:11.5px; font-weight:700; fill:#FFFFFF }
    .dot  { fill:#14584A }
  </style>

  <rect x="1" y="1" width="718" height="370" class="win"/>
  <rect x="1" y="1" width="718" height="24" fill="#2F3A34"/>
  <text x="12" y="17" class="tt">Device — СПК1хх [М01]</text>

  <!-- закладки вкладки устройства -->
  <rect x="1" y="25" width="718" height="24" class="bar"/>
  <rect x="8" y="27" width="150" height="22" fill="#FFFFFF" stroke="#B9BEB8"/>
  <text x="18" y="42" class="tb">Установки соединения</text>
  <text x="176" y="42" class="tm">Приложения</text>
  <text x="252" y="42" class="tm">Файлы</text>
  <text x="304" y="42" class="tm">Журнал</text>
  <text x="364" y="42" class="tm">Установки ПЛК</text>
  <text x="452" y="42" class="tm">Оболочка ПЛК</text>
  <text x="542" y="42" class="tm">Пользователи</text>

  <!-- панель шлюза -->
  <text x="20" y="76" class="tb">Шлюз</text>
  <rect x="20" y="84" width="220" height="22" class="pane"/>
  <text x="28" y="99" class="t">Gateway-1</text>
  <text x="226" y="99" class="t">▾</text>
  <circle cx="252" cy="95" r="5" fill="#2E7D5B"/>
  <text x="264" y="99" class="tm">шлюз запущен</text>

  <!-- список найденных устройств -->
  <text x="20" y="132" class="tb">Найденные устройства</text>
  <rect x="20" y="140" width="500" height="128" class="pane"/>
  <rect x="20" y="140" width="500" height="20" class="bar"/>
  <text x="30"  y="154" class="t">Имя устройства</text>
  <text x="270" y="154" class="t">Адрес</text>
  <text x="400" y="154" class="t">Тип</text>

  <rect x="21" y="161" width="498" height="20" fill="#2C6FB5"/>
  <text x="30"  y="175" class="mono" fill="#FFFFFF">spk1xxm01_a4f2</text>
  <text x="270" y="175" class="mono" fill="#FFFFFF">192.168.0.10</text>
  <text x="400" y="175" class="mono" fill="#FFFFFF">СПК1хх [М01]</text>

  <text x="30"  y="197" class="mono">plc200_0031</text>
  <text x="270" y="197" class="mono">192.168.0.44</text>
  <text x="400" y="197" class="mono">ПЛК200</text>

  <text x="30"  y="219" class="mono">spk210_1180</text>
  <text x="270" y="219" class="mono">192.168.0.51</text>
  <text x="400" y="219" class="mono">СПК210</text>

  <text x="30" y="250" class="tm">Найдено устройств: 3</text>

  <!-- кнопки -->
  <rect x="540" y="140" width="160" height="26" class="btnA"/>
  <text x="620" y="157" class="tt" text-anchor="middle">Сканировать сеть…</text>
  <rect x="540" y="174" width="160" height="26" class="btn"/>
  <text x="620" y="191" class="t" text-anchor="middle">Добавить шлюз…</text>
  <rect x="540" y="208" width="160" height="26" class="btn"/>
  <text x="620" y="225" class="t" text-anchor="middle">Добавить устройство…</text>

  <!-- состояние соединения -->
  <rect x="20" y="288" width="680" height="48" class="pane"/>
  <circle cx="42" cy="312" r="8" fill="#2E7D5B"/>
  <path d="M38 312 l3 4 l7 -8" stroke="#FFFFFF" stroke-width="2" fill="none"/>
  <text x="60" y="309" class="tb">Устройство активно: spk1xxm01_a4f2</text>
  <text x="60" y="325" class="tm">Готово к подключению — можно выполнять Логин (Alt+F8)</text>

  <!-- выноски -->
  <g>
    <circle cx="84" cy="38" r="10" class="dot"/><text x="84" y="42" class="cn" text-anchor="middle">1</text>
    <circle cx="620" cy="153" r="10" class="dot" opacity="0"/>
    <circle cx="524" cy="153" r="10" class="dot"/><text x="524" y="157" class="cn" text-anchor="middle">2</text>
    <circle cx="252" cy="171" r="10" class="dot"/><text x="252" y="175" class="cn" text-anchor="middle">3</text>
    <circle cx="42" cy="312" r="14" fill="none" stroke="#14584A" stroke-width="1.6"/>
    <circle cx="684" cy="312" r="10" class="dot"/><text x="684" y="316" class="cn" text-anchor="middle">4</text>
  </g>
</svg>
