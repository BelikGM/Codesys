<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" width="720" height="300" role="img" aria-label="Схема диалога при логине: выбор между онлайн-изменением, полной загрузкой и подключением без изменений">
  <style>
    .win  { fill:#F0F1EE; stroke:#A8AFA6; stroke-width:1 }
    .pane { fill:#FFFFFF; stroke:#B9BEB8; stroke-width:1 }
    .btn  { fill:#E9EBE6; stroke:#8E958C; stroke-width:1 }
    .btnA { fill:#14584A; stroke:#0D3F34; stroke-width:1 }
    .t    { font-family:"Segoe UI",Arial,sans-serif; font-size:11px; fill:#1A1D1A }
    .tb   { font-family:"Segoe UI",Arial,sans-serif; font-size:12px; font-weight:600; fill:#1A1D1A }
    .tm   { font-family:"Segoe UI",Arial,sans-serif; font-size:10.5px; fill:#6A716B }
    .tt   { font-family:"Segoe UI",Arial,sans-serif; font-size:11px; fill:#FFFFFF }
    .cn   { font-family:"Segoe UI",Arial,sans-serif; font-size:11.5px; font-weight:700; fill:#FFFFFF }
    .dot  { fill:#14584A }
  </style>

  <rect x="90" y="1" width="540" height="298" class="win"/>
  <rect x="90" y="1" width="540" height="26" fill="#2F3A34"/>
  <text x="104" y="19" class="tt">CODESYS</text>
  <text x="608" y="19" class="tt">✕</text>

  <!-- значок вопроса -->
  <circle cx="128" cy="66" r="15" fill="#2C6FB5"/>
  <text x="128" y="72" font-family="Segoe UI,Arial,sans-serif" font-size="19" font-weight="700" fill="#FFFFFF" text-anchor="middle">?</text>

  <text x="156" y="58" class="tb">Приложение изменено с момента последней загрузки.</text>
  <text x="156" y="76" class="t">Как продолжить?</text>

  <!-- варианты -->
  <rect x="112" y="96" width="496" height="46" class="pane"/>
  <circle cx="130" cy="112" r="6" fill="#FFFFFF" stroke="#6A716B"/>
  <circle cx="130" cy="112" r="3" fill="#14584A"/>
  <text x="146" y="116" class="tb">Онлайн-изменение</text>
  <text x="146" y="132" class="tm">ПЛК не останавливается · RETAIN сохраняются · фонтан продолжает работать</text>

  <rect x="112" y="148" width="496" height="46" class="pane"/>
  <circle cx="130" cy="164" r="6" fill="#FFFFFF" stroke="#6A716B"/>
  <text x="146" y="168" class="tb">Загрузка</text>
  <text x="146" y="184" class="tm">Полная перезаливка · ПЛК ОСТАНАВЛИВАЕТСЯ · насосы и свет встанут</text>

  <rect x="112" y="200" width="496" height="34" class="pane"/>
  <circle cx="130" cy="216" r="6" fill="#FFFFFF" stroke="#6A716B"/>
  <text x="146" y="220" class="tb">Подключиться без изменений</text>

  <!-- кнопки -->
  <rect x="404" y="252" width="94" height="26" class="btnA"/>
  <text x="451" y="269" class="tt" text-anchor="middle">OK</text>
  <rect x="508" y="252" width="100" height="26" class="btn"/>
  <text x="558" y="269" class="t" text-anchor="middle">Отмена</text>

  <!-- выноски -->
  <g>
    <circle cx="596" cy="112" r="10" class="dot"/><text x="596" y="116" class="cn" text-anchor="middle">1</text>
    <circle cx="596" cy="164" r="10" class="dot"/><text x="596" y="168" class="cn" text-anchor="middle">2</text>
    <circle cx="596" cy="216" r="10" class="dot"/><text x="596" y="220" class="cn" text-anchor="middle">3</text>
  </g>
</svg>
