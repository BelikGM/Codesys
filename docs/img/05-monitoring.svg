<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 352" width="720" height="352" role="img" aria-label="Схема онлайн-мониторинга: таблица объявлений с колонкой подготовленных и текущих значений переменных">
  <style>
    .win  { fill:#F0F1EE; stroke:#A8AFA6; stroke-width:1 }
    .pane { fill:#FFFFFF; stroke:#B9BEB8; stroke-width:1 }
    .bar  { fill:#E4E6E1; stroke:#B9BEB8; stroke-width:1 }
    .t    { font-family:"Segoe UI",Arial,sans-serif; font-size:11px; fill:#1A1D1A }
    .tb   { font-family:"Segoe UI",Arial,sans-serif; font-size:11px; font-weight:600; fill:#1A1D1A }
    .tm   { font-family:"Segoe UI",Arial,sans-serif; font-size:10.5px; fill:#6A716B }
    .tt   { font-family:"Segoe UI",Arial,sans-serif; font-size:11px; fill:#FFFFFF }
    .mono { font-family:"Consolas","DejaVu Sans Mono",monospace; font-size:10.5px; fill:#1A1D1A }
    .ok   { font-family:"Consolas","DejaVu Sans Mono",monospace; font-size:10.5px; font-weight:700; fill:#226B4C }
    .bad  { font-family:"Consolas","DejaVu Sans Mono",monospace; font-size:10.5px; font-weight:700; fill:#9E2B1C }
    .cn   { font-family:"Segoe UI",Arial,sans-serif; font-size:11.5px; font-weight:700; fill:#FFFFFF }
    .dot  { fill:#14584A }
  </style>

  <rect x="1" y="1" width="718" height="350" class="win"/>
  <rect x="1" y="1" width="718" height="24" fill="#2F3A34"/>
  <text x="12" y="17" class="tt">GVL — Онлайн</text>
  <rect x="612" y="5" width="66" height="16" fill="#226B4C"/>
  <text x="645" y="17" class="tt" text-anchor="middle">РАБОТА</text>

  <!-- шапка таблицы -->
  <rect x="8" y="34" width="704" height="290" class="pane"/>
  <rect x="8" y="34" width="704" height="22" class="bar"/>
  <text x="20"  y="49" class="tb">Выражение</text>
  <text x="300" y="49" class="tb">Тип</text>
  <text x="400" y="49" class="tb">Значение</text>
  <text x="530" y="49" class="tb">Подготовленное значение</text>

  <g class="mono">
    <text x="20" y="76">xMV110_Error</text>       <text x="300" y="76">BOOL</text>  <text x="400" y="76" class="ok">FALSE</text>
    <text x="20" y="98">xMU110_Error</text>       <text x="300" y="98">BOOL</text>  <text x="400" y="98" class="ok">FALSE</text>
    <text x="20" y="120">xPumpCommError[1]</text> <text x="300" y="120">BOOL</text> <text x="400" y="120" class="ok">FALSE</text>
    <text x="20" y="142">xPumpCommError[2]</text> <text x="300" y="142">BOOL</text> <text x="400" y="142" class="ok">FALSE</text>
    <text x="20" y="164">xPumpCommError[3]</text> <text x="300" y="164">BOOL</text> <text x="400" y="164" class="ok">FALSE</text>
  </g>

  <line x1="9" y1="178" x2="711" y2="178" stroke="#D5DBD2"/>

  <g class="mono">
    <text x="20" y="200">wMV110_Inputs</text>     <text x="300" y="200">WORD</text>  <text x="400" y="200">16#0A4C</text>
    <text x="20" y="222">wMU110_Outputs</text>    <text x="300" y="222">WORD</text>  <text x="400" y="222">16#0009</text>
  </g>

  <line x1="9" y1="236" x2="711" y2="236" stroke="#D5DBD2"/>

  <g class="mono">
    <text x="20" y="258">xDryRunAlarm</text>      <text x="300" y="258">BOOL</text>  <text x="400" y="258" class="ok">FALSE</text>
    <text x="20" y="280">xAlarmFountain</text>    <text x="300" y="280">BOOL</text>  <text x="400" y="280" class="ok">FALSE</text>
  </g>

  <rect x="9" y="288" width="702" height="20" fill="#F2DFDA"/>
  <text x="20"  y="302" class="mono">diRtcSetBias</text>
  <text x="300" y="302" class="mono">DINT</text>
  <text x="400" y="302" class="bad">-10800</text>
  <text x="530" y="302" class="tm">ожидаемое значение</text>

  <text x="20" y="340" class="tm">Двойной клик по POU в дереве открывает эту таблицу. Значения обновляются вживую.</text>

  <!-- выноски -->
  <g>
    <circle cx="692" cy="120" r="10" class="dot"/><text x="692" y="124" class="cn" text-anchor="middle">1</text>
    <circle cx="692" cy="211" r="10" class="dot"/><text x="692" y="215" class="cn" text-anchor="middle">2</text>
    <circle cx="692" cy="269" r="10" class="dot"/><text x="692" y="273" class="cn" text-anchor="middle">3</text>
    <circle cx="692" cy="298" r="10" class="dot"/><text x="692" y="302" class="cn" text-anchor="middle">4</text>
  </g>
</svg>
