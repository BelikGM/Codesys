<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 340" width="720" height="340" role="img" aria-label="Схема добавления третьего преобразователя частоты: копия EMD_PUMP_1 в дереве Modbus, переименование в EMD_PUMP_3 и адрес 43">
  <style>
    .win  { fill:#F0F1EE; stroke:#A8AFA6; stroke-width:1 }
    .pane { fill:#FFFFFF; stroke:#B9BEB8; stroke-width:1 }
    .bar  { fill:#E4E6E1; stroke:#B9BEB8; stroke-width:1 }
    .menu { fill:#FFFFFF; stroke:#8E958C; stroke-width:1 }
    .t    { font-family:"Segoe UI",Arial,sans-serif; font-size:11px; fill:#1A1D1A }
    .tb   { font-family:"Segoe UI",Arial,sans-serif; font-size:11px; font-weight:600; fill:#1A1D1A }
    .tm   { font-family:"Segoe UI",Arial,sans-serif; font-size:10.5px; fill:#6A716B }
    .tt   { font-family:"Segoe UI",Arial,sans-serif; font-size:11px; fill:#FFFFFF }
    .mono { font-family:"Consolas","DejaVu Sans Mono",monospace; font-size:10.5px; fill:#1A1D1A }
    .cn   { font-family:"Segoe UI",Arial,sans-serif; font-size:11.5px; font-weight:700; fill:#FFFFFF }
    .dot  { fill:#14584A }
  </style>

  <rect x="1" y="1" width="718" height="338" class="win"/>
  <rect x="1" y="1" width="718" height="24" fill="#2F3A34"/>
  <text x="12" y="17" class="tt">Дерево устройств — Modbus_COM_2</text>

  <!-- дерево -->
  <rect x="8" y="34" width="300" height="290" class="pane"/>
  <rect x="8" y="34" width="300" height="20" class="bar"/>
  <text x="18" y="48" class="tb">Устройства</text>

  <g class="mono">
    <text x="18" y="76">▾ Modbus_COM_2</text>
    <text x="30" y="98">▾ Modbus_Master_COM_Port</text>
    <text x="46" y="120">EMD_PUMP_1   (41)</text>
    <text x="46" y="142">EMD_PUMP_2   (42)</text>
  </g>
  <rect x="42" y="150" width="258" height="18" fill="#2C6FB5"/>
  <text x="46" y="163" class="mono" fill="#FFFFFF">EMD_PUMP_3   (43)</text>
  <text x="46" y="188" class="tm">новое устройство — имя обязано</text>
  <text x="46" y="202" class="tm">совпадать с обращением в коде</text>

  <!-- контекстное меню -->
  <rect x="150" y="212" width="196" height="90" class="menu"/>
  <text x="164" y="232" class="t">Вырезать</text>
  <text x="164" y="252" class="t">Копировать</text>
  <rect x="151" y="258" width="194" height="20" fill="#DCE8E3"/>
  <text x="164" y="272" class="tb">Вставить</text>
  <text x="164" y="294" class="t">Добавление устройства…</text>

  <!-- правая часть: свойства -->
  <rect x="360" y="34" width="352" height="290" class="pane"/>
  <rect x="360" y="34" width="352" height="20" class="bar"/>
  <text x="370" y="48" class="tb">EMD_PUMP_3 — Общее</text>

  <text x="374" y="80" class="t">Slave Address (1..247)</text>
  <rect x="374" y="88" width="90" height="22" class="pane"/>
  <text x="384" y="103" class="mono">43</text>

  <text x="374" y="136" class="t">Таймаут ответа (мс)</text>
  <rect x="374" y="144" width="90" height="22" class="pane"/>
  <text x="384" y="159" class="mono">1000</text>

  <line x1="368" y1="186" x2="704" y2="186" stroke="#D5DBD2"/>

  <text x="374" y="208" class="tb">Проверка после добавления</text>
  <text x="374" y="228" class="mono">cPumpCount := 3</text>
  <text x="374" y="248" class="mono">PRG_Pumps.st : 354, 379</text>
  <text x="374" y="268" class="mono">EMD_PUMP_3.xError</text>
  <text x="374" y="294" class="tm">F11 — ошибка «не определён» должна уйти</text>

  <!-- выноски -->
  <g>
    <circle cx="292" cy="120" r="10" class="dot"/><text x="292" y="124" class="cn" text-anchor="middle">1</text>
    <circle cx="330" cy="268" r="10" class="dot"/><text x="330" y="272" class="cn" text-anchor="middle">2</text>
    <circle cx="292" cy="159" r="10" class="dot"/><text x="292" y="163" class="cn" text-anchor="middle">3</text>
    <circle cx="490" cy="99" r="10" class="dot"/><text x="490" y="103" class="cn" text-anchor="middle">4</text>
    <circle cx="690" cy="208" r="10" class="dot"/><text x="690" y="212" class="cn" text-anchor="middle">5</text>
  </g>
</svg>
