<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 292" width="620" height="292" role="img" aria-label="Контекстное меню узла Device в дереве проекта с пунктом «Обновить устройство…»">
  <style>
    .pane { fill:#FFFFFF; stroke:#B9BEB8; stroke-width:1 }
    .menu { fill:#F5F6F3; stroke:#8E958C; stroke-width:1 }
    .selr { fill:#CCE3F5; stroke:#7EA9CC; stroke-width:1 }
    .t    { font-family:"Segoe UI",Arial,sans-serif; font-size:11.5px; fill:#1A1D1A }
    .tm   { font-family:"Segoe UI",Arial,sans-serif; font-size:11px; fill:#6A716B }
    .mono { font-family:"Consolas","DejaVu Sans Mono",monospace; font-size:10.5px; fill:#1A1D1A }
    .cn   { font-family:"Segoe UI",Arial,sans-serif; font-size:11.5px; font-weight:700; fill:#FFFFFF }
    .lbl  { font-family:"Segoe UI",Arial,sans-serif; font-size:11.5px; font-weight:600; fill:#14584A }
    .lbs  { font-family:"Segoe UI",Arial,sans-serif; font-size:10.5px; fill:#6A716B }
    .dot  { fill:#14584A }
    .lead { stroke:#14584A; stroke-width:1.3; fill:none }
    .sep  { stroke:#D5DBD2; stroke-width:1 }
  </style>

  <!-- дерево проекта -->
  <rect x="1" y="1" width="200" height="290" class="pane"/>
  <g class="mono">
    <text x="10" y="18">60_years_v1</text>
    <text x="18" y="38">▾ Device (SPK1xx[M01])</text>
    <text x="30" y="58">▾ Plc Logic</text>
    <text x="42" y="78">▾ Application</text>
    <text x="54" y="98">E_PumpType</text>
    <text x="54" y="118">GVL</text>
    <text x="54" y="138">GVL_Fountain</text>
    <text x="54" y="158">PLC_PRG</text>
    <text x="54" y="178">PRG_Fountain</text>
    <text x="54" y="198">PRG_Pumps</text>
    <text x="54" y="218">FB_Pump</text>
    <text x="54" y="238">FB_SunsetRelay</text>
  </g>
  <rect x="16" y="26" width="182" height="16" fill="none" stroke="#7EA9CC" stroke-width="1.4" stroke-dasharray="3 2"/>

  <!-- контекстное меню -->
  <rect x="150" y="26" width="200" height="242" class="menu"/>

  <text x="176" y="44" class="t">Вырезать</text>
  <text x="176" y="66" class="t">Копировать</text>
  <text x="176" y="88" class="t">Вставить</text>
  <text x="176" y="110" class="t">Удалить</text>
  <line x1="156" y1="120" x2="344" y2="120" class="sep"/>

  <text x="176" y="138" class="t">Рефакторинг</text>
  <text x="332" y="138" class="t">▸</text>
  <line x1="156" y1="148" x2="344" y2="148" class="sep"/>

  <text x="176" y="166" class="t">Свойства…</text>
  <line x1="156" y1="176" x2="344" y2="176" class="sep"/>

  <text x="176" y="194" class="t">Добавление объекта</text>
  <text x="332" y="194" class="t">▸</text>
  <text x="176" y="216" class="t">Добавить папку…</text>
  <text x="176" y="238" class="t">Добавить устройство…</text>

  <rect x="151" y="246" width="198" height="21" class="selr"/>
  <text x="176" y="261" class="t">Обновить устройство…</text>

  <!-- выноски -->
  <g>
    <path d="M201 34 H236 V 14 H372" class="lead"/>
    <circle cx="386" cy="14" r="10" class="dot"/><text x="386" y="18" class="cn" text-anchor="middle">1</text>
    <text x="402" y="11" class="lbl">Правый клик по узлу Device</text>
    <text x="402" y="25" class="lbs">самый верхний узел дерева</text>

    <path d="M350 257 H372" class="lead"/>
    <circle cx="386" cy="257" r="10" class="dot"/><text x="386" y="261" class="cn" text-anchor="middle">2</text>
    <text x="402" y="254" class="lbl">Обновить устройство…</text>
    <text x="402" y="268" class="lbs">меняет тип контроллера в проекте</text>
  </g>

  <!-- пояснение -->
  <rect x="400" y="60" width="212" height="150" fill="#F3F5F0" stroke="#C3CAC1"/>
  <text x="412" y="82" class="lbl">Проверка на ПК без железа</text>
  <text x="412" y="102" class="lbs">выбрать</text>
  <text x="412" y="118" class="mono">CODESYS Control Win V3</text>

  <text x="412" y="146" class="lbl">Перед выездом вернуть</text>
  <text x="412" y="166" class="mono">СПК1хх [М01]</text>
  <text x="412" y="186" class="lbs">иначе сканирование сети</text>
  <text x="412" y="200" class="lbs">не найдёт контроллер</text>
</svg>
